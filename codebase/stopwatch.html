<!DOCTYPE html>
<html lang="en">
  
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" 
          content="IE=edge">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>Design Stopwatch using HTML CSS and JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <style>/* General reset */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('pics/634013.jpg'); /* Background image */
                background-size: cover; /* Ensures the image covers the entire page */
                background-position: center; /* Centers the image */
                background-attachment: fixed; /* Keeps the background in place while scrolling */
                margin: 0;
                padding: 0;
        }
        
        /* Container styling */
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        /* Title styling */
        h1 {
            color: #333333;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        /* Timer section */
        #time {
            margin: 20px 0;
        }
        
        .digit {
            font-size: 2rem;
            font-weight: bold;
            color: hsl(157, 100%, 40%);
            margin: 0 5px;
        }
        
        .txt {
            font-size: 1rem;
            color: #777777;
            margin: 0 8px;
        }
        
        /* Buttons styling */
        #buttons {
            margin-top: 20px;
        }
        
        .btn {
            background-color:  hsl(157, 100%, 40%);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            margin: 0 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .btn:hover {
            background-color:  hwb(157 14% 54%);
        }
        
        .btn:active {
            background-color: hwb(157 9% 57%);
        }
        </style>
</head>

<body>
    <div class="container">
        <h1>
            Stop Watch</h1>
        <div id="time">
            <span class="digit" id="hr">
                00</span>
            <span class="txt">Hr</span>
            <span class="digit" id="min">
                00</span>
            <span class="txt">Min</span>
            <span class="digit" id="sec">
                00</span>
            <span class="txt">Sec</span>
            <span class="digit" id="count">
                00</span>
        </div>
        <div id="buttons">
            <button class="btn" id="start">
                Start</button>
            <button class="btn" id="stop">
                Stop</button>
            <button class="btn" id="reset">
                Reset</button>
        </div>
    </div>

    <script>let startBtn = document.getElementById('start');
        let stopBtn = document.getElementById('stop');
        let resetBtn = document.getElementById('reset');
        
        let hour = 0;
        let minute = 0;
        let second = 0;
        let count = 0;
        
        startBtn.addEventListener('click', function () {
            timer = true;
            stopWatch();
        });
        
        stopBtn.addEventListener('click', function () {
            timer = false;
        });
        
        resetBtn.addEventListener('click', function () {
            timer = false;
            hour = 0;
            minute = 0;
            second = 0;
            count = 0;
            document.getElementById('hr').innerHTML = "00";
            document.getElementById('min').innerHTML = "00";
            document.getElementById('sec').innerHTML = "00";
            document.getElementById('count').innerHTML = "00";
        });
        
        function stopWatch() {
            if (timer) {
                count++;
        
                if (count == 100) {
                    second++;
                    count = 0;
                }
        
                if (second == 60) {
                    minute++;
                    second = 0;
                }
        
                if (minute == 60) {
                    hour++;
                    minute = 0;
                    second = 0;
                }
        
                let hrString = hour;
                let minString = minute;
                let secString = second;
                let countString = count;
        
                if (hour < 10) {
                    hrString = "0" + hrString;
                }
        
                if (minute < 10) {
                    minString = "0" + minString;
                }
        
                if (second < 10) {
                    secString = "0" + secString;
                }
        
                if (count < 10) {
                    countString = "0" + countString;
                }
        
                document.getElementById('hr').innerHTML = hrString;
                document.getElementById('min').innerHTML = minString;
                document.getElementById('sec').innerHTML = secString;
                document.getElementById('count').innerHTML = countString;
                setTimeout(stopWatch, 10);
            }
        }
        </script>
</body>
  
</html>
