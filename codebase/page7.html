<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherNow</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 20px;
      background-image: url('pics/bernard-hermant-6pPAC8z8Vl8-unsplash.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    input, select {
      padding: 10px;
      width: 70%;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-weight: bold;
      background-color: hsl(0, 91%, 52%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      background-color: #b30505;
      color: white;
      transform: scale(1.05);
    }

    #result {
      margin-top: 20px;
    }
    
  </style>
</head>
<body>
  <div class="container">
    <h1>Solar Irradiance Data</h1>
    <input type="text" id="city" placeholder="Enter city name" />
    <br>
    <label for="date">Select Date:</label><br>
    <input type="date" id="date">
    <br>
    <label for="interval">Interval (hours):</label><br>
    <select id="interval">
      <option value="1">1</option>
      <option value="3">3</option>
      <option value="6">6</option>
      <option value="12">12</option>
    </select>
    <br><br>
    <button onclick="fetchSolarData()">Get Solar Data</button>
    <div id="result"></div>
  </div>

  <script src="Page7.js">
    
  </script>
</body>
</html>
