<!DOCTYPE html>

<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <title>WeatherNow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            
            margin: 0;
            padding: 0;
            background-image: url('pics/634013.jpg'); /* Background image */
                background-size: cover; /* Ensures the image covers the entire page */
                background-position: center; /* Centers the image */
                background-attachment: fixed; /* Keeps the background in place while scrolling */
                margin: 0;
                padding: 0;
        }
        .form-box {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .textup {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50; /* Darker shade for text */
        }
        .form-box i {
            margin-right: 8px;
            color: #27ae60; /* Green color for icons */
        }
        form label {
            font-size: 14px;
            color: #2c3e50; /* Dark greenish-black for labels */
            margin-bottom: 8px;
            display: block;
        }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #2c3e50; /* Dark border for input fields */
            border-radius: 5px;
            font-size: 14px;
            color: #333;
            background-color: #ecf0f1; /* Light grey background for inputs */
        }
        textarea {
            resize: vertical;
        }
        .radio-group {
            margin-bottom: 15px;
        }
        .radio-group input[type="radio"] {
            margin-right: 5px;
        }
        .radio-group label {
            margin-right: 15px;
            font-size: 14px;
            color: #2c3e50;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60; /* Green button */
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        button:hover {
            background-color: #2ecc71; /* Lighter green on hover */
        }
        .card {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-right: 10px;
        }
        .star {
            font-size: 24px;
            color: #bdc3c7; /* Light grey color for stars initially */
            cursor: pointer;
        }
        .star.one {
            color: #e74c3c; /* Red for 1 star */
        }
        .star.two {
            color: #f39c12; /* Orange for 2 stars */
        }
        .star.three {
            color: #f1c40f; /* Yellow for 3 stars */
        }
        .star.four {
            color: #2ecc71; /* Green for 4 stars */
        }
        .star.five {
            color: #27ae60; /* Darker green for 5 stars */
        }
        h3 {
            font-size: 16px;
            color: #2c3e50; /* Dark greenish-black for rating text */
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <div class="textup">
            <i class="fa fa-solid fa-clock"></i>
            It only takes two minutes!!
        </div>
        <form>
            <label for="uname">
                <i class="fa fa-solid fa-user"></i>
                Name
            </label>
            <input type="text" id="uname" 
                   name="uname" required>

            <label for="email">
                <i class="fa fa-solid fa-envelope"></i>
                Email Address
            </label>
            <input type="email" id="email" 
                   name="email" required>

            <label for="phone">
                <i class="fa-solid fa-phone"></i>
                Phone No
            </label>
            <input type="tel" id="phone" 
                   name="phone" required>

            <label>
                <i class="fa-solid fa-face-smile"></i>
                Do you satisfy with our service?
            </label>
            <div class="radio-group">
                <input type="radio" id="yes" 
                       name="satisfy" value="yes" checked>
                <label for="yes">Yes</label>

                <input type="radio" id="no" 
                       name="satisfy" value="no">
                <label for="no">No</label>
            </div>

            <label for="msg">
                <i class="fa-solid fa-comments" 
                   style="margin-right: 3px;"></i>
                Write your Suggestions:
            </label>
            <textarea id="msg" name="msg" 
                      rows="4" cols="10" required>
            </textarea>
            <div class="card">
                <br />
                <span onclick="gfg(1)" class="star">★</span>
                <span onclick="gfg(2)" class="star">★</span>
                <span onclick="gfg(3)" class="star">★</span>
                <span onclick="gfg(4)" class="star">★</span>
                <span onclick="gfg(5)" class="star">★</span>
                <h3 id="output">Rating is: 0/5</h3>
            </div>
            <button onclick="window.location.href='Main.html'">Submit</button><br><br>

        </form>
    </div>

    <script>
        // To access the stars
        let stars = document.getElementsByClassName("star");
        let output = document.getElementById("output");

        // Function to update rating
        function gfg(n) {
            remove();
            for (let i = 0; i < n; i++) {
                if (n == 1) cls = "one";
                else if (n == 2) cls = "two";
                else if (n == 3) cls = "three";
                else if (n == 4) cls = "four";
                else if (n == 5) cls = "five";
                stars[i].className = "star " + cls;
            }
            output.innerText = "Rating is: " + n + "/5";
        }

        // To remove the pre-applied styling
        function remove() {
            let i = 0;
            while (i < 5) {
                stars[i].className = "star";
                i++;
            }
        }

        // Function to handle form submission
       
        
    </script>
</body>
